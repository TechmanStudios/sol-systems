name: SOL Systems CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sol-systems-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    name: Integration (${{ matrix.os }} / Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12"]
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v6
      - name: Check out pinned integration dependencies
        # sol-edge is private and is not used by the integration suite.
        run: git submodule update --init sol Frontier_OS sol-lens
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            sol-decide/pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt "pytest>=8,<10"
      - name: Run integrated tests
        run: python -m pytest tests -q --junitxml=integration-results.xml
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-${{ matrix.os }}-py${{ matrix.python }}
          path: integration-results.xml

  frontier-lint:
    name: Frontier_OS lint and formatting
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - run: git submodule update --init Frontier_OS
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install ruff==0.15.11
      - run: python -m ruff check Frontier_OS/Exciton-MoA
      - run: python -m ruff format --check Frontier_OS/Exciton-MoA
