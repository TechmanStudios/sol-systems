name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  integration:
    name: Integration (${{ matrix.os }} / py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout superproject
        uses: actions/checkout@v6
        with:
          lfs: false
          submodules: false

      - name: Initialize public integration submodules
        run: |
          git submodule sync -- sol Frontier_OS sol-lens sol-edge sol-holo
          git submodule update --init sol Frontier_OS sol-lens sol-edge sol-holo

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Preflight editable dependency check
        shell: python
        run: |
          from pathlib import Path
          import sys

          req_path = Path("requirements.txt")
          missing = []
          for raw in req_path.read_text(encoding="utf-8").splitlines():
              line = raw.strip()
              if line.startswith("-e "):
                  target = Path(line[3:].strip())
                  has_pkg = (target / "pyproject.toml").is_file() or (target / "setup.py").is_file()
                  print(f"[preflight] editable target {target}: exists={target.exists()} package_meta={has_pkg}")
                  if not has_pkg:
                      missing.append(str(target))
          if missing:
              sys.exit(f"Editable dependency preflight failed; missing pyproject.toml/setup.py in: {missing}")

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run integration suite
        env:
          PYTHONUTF8: "1"
        run: |
          python -m pytest --import-mode=importlib tests sol/tests/test_circuit_metric_evaluation.py sol-continuum/tests/test_sol_continuum.py sol-change/tests sol-decide/tests sol-holo/tests/test_sol_holo.py -k "not live" -q --junitxml=integration-results.xml

      - name: Upload JUnit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: integration-results-${{ matrix.os }}-py${{ matrix.python-version }}
          path: integration-results.xml
          if-no-files-found: ignore

  lint-submodules:
    name: Frontier_OS ruff check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout superproject
        uses: actions/checkout@v6
        with:
          lfs: false
          submodules: false

      - name: Initialize Frontier_OS
        run: |
          git submodule sync -- Frontier_OS
          git submodule update --init Frontier_OS

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install ruff
        run: python -m pip install ruff==0.15.11

      - name: Ruff lint & format check (Exciton-MoA)
        working-directory: Frontier_OS
        run: |
          ruff check Exciton-MoA
          ruff format --check Exciton-MoA
