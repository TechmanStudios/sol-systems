[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sol-change-observatory"
version = "0.2.0"
description = "Local, evidence-linked comparison of agent workflow changes"
requires-python = ">=3.11"
dependencies = []

[tool.setuptools]
py-modules = ["app"]

[tool.setuptools.packages.find]
include = ["observatory*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
