[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sol-continuum"
version = "0.1.0"
description = "SOL Continuum: Autonomous Agentic Research, Curriculum Evolution & Scientific Discovery Workspace Integrated with the SOL Change Observatory"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0.0",
    "numpy>=1.26.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["sol_continuum*"]
